name: CI and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Unfiltered, so pull requests stacked on other feature branches are tested
  # too, not only those targeting main.
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job opts back up to contents: write.
permissions:
  contents: read

# A new push to a PR makes the in-flight run pointless. Pushes to main and tags
# are left alone so no release run is ever cancelled halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEFAULT_PYTHON: '3.12'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Gated: syntax errors, undefined names, broken comparisons. See ruff.toml.
      - name: Check for defects
        run: ruff check --output-format=github .

      # Not gated: the wider default rule set flags pre-existing style debt.
      # Surfacing it keeps it visible without blocking a merge on it.
      - name: Style report
        if: always()
        run: |
          {
            echo '### Lint debt (not gated)'
            echo
            echo '```'
            ruff check --select E,W,F,B,SIM,UP,I,RUF,PERF --statistics . || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # One version failing should not hide the result on the others.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q --durations=5

  build:
    name: Build and verify artifacts
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build every example for every target
        run: ./build-examples.sh dist

      # The build scripts are pure functions of the model file. If two runs
      # disagree, something has picked up dict ordering, a timestamp or a hash
      # seed, and released binaries would stop matching what anyone can rebuild.
      - name: Check builds are reproducible
        run: |
          ./build-examples.sh dist-repeat > /dev/null
          for artifact in dist/*; do
            cmp "$artifact" "dist-repeat/$(basename "$artifact")" \
              || { echo "::error::$(basename "$artifact") is not reproducible"; exit 1; }
          done
          echo "All artifacts are byte-identical across two builds"
          rm -rf dist-repeat

      # The point of the whole exercise: a binary that assembles but computes
      # the wrong answer must not reach a release.
      - name: Verify artifacts against the reference model
        run: python verify_artifacts.py --dist dist --query HELLO

      - name: Report artifact sizes
        if: always()
        run: |
          {
            echo '### Artifact sizes'
            echo
            echo '| artifact | bytes | KB |'
            echo '|---|---:|---:|'
            for artifact in dist/*; do
              size=$(wc -c < "$artifact")
              awk -v n="$(basename "$artifact")" -v s="$size" \
                'BEGIN { printf "| `%s` | %s | %.1f |\n", n, s, s / 1024 }'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: z80-binaries
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: z80-binaries
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GUESS.COM
            dist/GUESS-FAST.COM
            dist/GUESS.TAP
            dist/GUESS.bin
            dist/CHAT.COM
            dist/CHAT-FAST.COM
            dist/CHAT.TAP
            dist/CHAT.bin
          fail_on_unmatched_files: true
          generate_release_notes: true
